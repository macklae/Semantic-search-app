<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semantic Knowledge Base Search</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-border: #262b38;
    --text: #e7e9ee;
    --muted: #9aa2b1;
    --accent: #6c8dff;
    --accent-2: #48d9c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2436 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header { text-align: center; margin-bottom: 32px; }
  header h1 {
    font-size: 1.75rem;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }

  .search-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-panel input[type="text"] {
    flex: 1 1 260px;
    min-width: 0;
    background: #0f1117;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
  }
  .search-panel input[type="text"]:focus { border-color: var(--accent); }
  select {
    background: #0f1117;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 0.9rem;
  }
  button {
    background: var(--accent);
    color: #0b0d12;
    border: none;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.6; cursor: default; }

  .status { text-align: center; color: var(--muted); margin: 18px 0; font-size: 0.9rem; min-height: 1.2em; }

  .results { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .badge {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    border-radius: 999px;
    padding: 2px 10px;
    white-space: nowrap;
  }
  .score { color: var(--muted); font-size: 0.82rem; }
  .card p { color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 10px 0 0; }
  .doc-id { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 50px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Semantic Knowledge Base Search</h1>
      <p>Search by meaning, not just keywords &mdash; powered by Word2Vec + cosine similarity.</p>
    </header>

    <div class="search-panel">
      <input id="query" type="text" placeholder="e.g. my password is not working" autofocus />
      <select id="category"><option value="">All categories</option></select>
      <button id="searchBtn">Search</button>
    </div>

    <div id="status" class="status"></div>
    <div id="results" class="results"></div>

    <footer>FastAPI backend &middot; Word2Vec semantic search</footer>
  </div>

<script>
  const queryInput = document.getElementById("query");
  const categorySelect = document.getElementById("category");
  const searchBtn = document.getElementById("searchBtn");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  async function loadCategories() {
    try {
      const res = await fetch("/api/categories");
      const data = await res.json();
      for (const cat of data.categories || []) {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      }
    } catch (e) {
      // Non-fatal: category filter just won't populate.
    }
  }

  function renderResults(results) {
    resultsEl.innerHTML = "";
    if (!results.length) {
      statusEl.textContent = "No matching results.";
      return;
    }
    statusEl.textContent = `${results.length} result${results.length > 1 ? "s" : ""}`;
    for (const r of results) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top">
          <h3>${escapeHtml(r.title)}</h3>
          <span class="badge">${escapeHtml(r.category)}</span>
        </div>
        <div class="score">Similarity: ${(r.score * 100).toFixed(1)}%</div>
        <p>${escapeHtml(r.content)}</p>
        <div class="doc-id">${escapeHtml(r.document_id)}</div>
      `;
      resultsEl.appendChild(card);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function runSearch() {
    const query = queryInput.value.trim();
    if (!query) return;

    searchBtn.disabled = true;
    statusEl.textContent = "Searching…";
    resultsEl.innerHTML = "";

    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query,
          top_k: 8,
          category: categorySelect.value || null,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const results = await res.json();
      renderResults(results);
    } catch (e) {
      statusEl.textContent = `Error: ${e.message}`;
    } finally {
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener("click", runSearch);
  queryInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });

  loadCategories();
</script>
</body>
</html>
